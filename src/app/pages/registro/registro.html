
<div class="registro-container">
  <div class="registro-card">
    <a routerLink="/login" class="volver">← Volver al inicio de sesión</a>

    <h1>Crear cuenta</h1>
    <p class="subtitulo">
      Regístrate en TecniHub para comenzar.
    </p>

    <form (ngSubmit)="registrar()" #formRegistro="ngForm">
      <div class="campo">
        <label for="nombre">Nombre *</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          [(ngModel)]="nombre"
          maxlength="100"
          autocomplete="given-name"
          required
        />
      </div>

      <div class="campo">
        <label for="apellidos">Apellidos *</label>
        <input
          id="apellidos"
          name="apellidos"
          type="text"
          [(ngModel)]="apellidos"
          maxlength="100"
          autocomplete="family-name"
          required
        />
      </div>

      <div class="campo">
        <label for="email">Correo electrónico *</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          maxlength="150"
          autocomplete="email"
          required
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña *</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          minlength="8"
          maxlength="100"
          autocomplete="new-password"
          required
        />
        <small>Entre 8 y 100 caracteres.</small>
      </div>

      <div class="campo">
        <label for="telefono">Teléfono *</label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          [(ngModel)]="telefono"
          inputmode="numeric"
          pattern="[0-9]{10}"
          maxlength="10"
          autocomplete="tel"
          placeholder="10 dígitos"
          required
        />
      </div>

      <div class="campo">
        <label for="direccion">Dirección (opcional)</label>
        <input
          id="direccion"
          name="direccion"
          type="text"
          [(ngModel)]="direccion"
          maxlength="255"
          autocomplete="street-address"
        />
      </div>

      <div
        *ngIf="errorMessage"
        class="mensaje error"
        role="alert"
      >
        {{ errorMessage }}
      </div>

      <div
        *ngIf="successMessage"
        class="mensaje exito"
        role="status"
      >
        {{ successMessage }}
      </div>

      <button
  type="submit"
  [disabled]="loading"
>
  {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
</button>

      <button
        *ngIf="successMessage"
        type="button"
        class="boton-secundario"
        (click)="irAlLogin()"
      >
        Ir al inicio de sesión
      </button>
    </form>

    <p class="pie">
      ¿Ya tienes una cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
