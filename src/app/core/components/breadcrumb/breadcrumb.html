@if (breadcrumbs$ | async; as items) {
  @if (items.length > 0) {
    <nav class="breadcrumb-nav" aria-label="Ruta de navegación">
      <ol class="breadcrumb-list">
        @for (item of items; track $index; let isFirst = $first; let isLast = $last) {
          <li class="breadcrumb-item" [class.active]="isLast">
            @if (!isLast && item.url) {
              <a [routerLink]="item.url" [queryParams]="item.queryParams" class="breadcrumb-link">
                @if (isFirst) {
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                  </svg>
                }
                <span>{{ item.label }}</span>
              </a>
            } @else {
              <span class="breadcrumb-current" [attr.aria-current]="isLast ? 'page' : null">
                @if (isFirst) {
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                  </svg>
                }
                <span>{{ item.label }}</span>
              </span>
            }

            @if (!isLast) {
              <span class="breadcrumb-separator" aria-hidden="true">›</span>
            }
          </li>
        }
      </ol>
    </nav>
  }
}
