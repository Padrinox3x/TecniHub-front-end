@if (breadcrumbsList.length > 0) {
  <nav aria-label="Ruta de navegación" class="breadcrumb-nav">
    <ol class="breadcrumb-list">
      @for (item of breadcrumbsList; track $index; let isLast = $last; let isFirst = $first) {
        <li class="breadcrumb-item" [class.active]="isLast">
          @if (isFirst) {
            <svg class="breadcrumb-home-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m3 10 9-7 9 7" />
              <path d="M5 9v11h14V9M9 20v-6h6v6" />
            </svg>
          }

          @if (!isLast && item.url) {
            <a [routerLink]="item.url" class="breadcrumb-link">
              {{ item.label }}
            </a>
            <span class="breadcrumb-separator" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </span>
          } @else {
            <span class="breadcrumb-current" aria-current="page">
              {{ item.label }}
            </span>
          }
        </li>
      }
    </ol>
  </nav>
}
